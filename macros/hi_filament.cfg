# hi_filament.cfg - single-colour load/unload for the Creality Hi WITHOUT the CFS box.
# Stock LOAD_MATERIAL / QUIT_MATERIAL / LOAD_FILAMENT all call BOX_* commands and fail with no box.
# Install: upload to the config folder, add  [include hi_filament.cfg]  to printer.cfg
#          (next to the other [include] lines, ABOVE the SAVE_CONFIG block), then RESTART
#          (host RESTART - NOT FIRMWARE_RESTART, that locks up the Hi).
#
#   HI_LOAD                       feed filament into the extruder until it grips, then run
#   HI_LOAD TEMP=240 LENGTH=120   PETG, longer purge
#   HI_UNLOAD                     heats, forms the tip, pulls it out of the gears
#   HI_UNLOAD TEMP=240
# Both park over the purge chute (box.cfg extrude_pos_x/y), refuse while printing,
# and switch the heater + extruder motor off at the end (KEEP_HOT=1 to leave it hot).

[gcode_macro HI_LOAD]
description: Single colour (no CFS): heat, load and purge
gcode:
  {% set temp = params.TEMP|default(220)|int %}
  {% set length = params.LENGTH|default(100)|float %}
  {% set keep_hot = params.KEEP_HOT|default(0)|int %}
  {% set box = printer.configfile.settings['box'] %}
  {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
    RESPONSE_INFO MSG="!! HI_LOAD: printer is {printer.print_stats.state} - use M600 for a mid-print change"
  {% elif temp < 170 or temp > 300 %}
    RESPONSE_INFO MSG="!! HI_LOAD: TEMP={temp} out of range (170-300)"
  {% else %}
    SAVE_GCODE_STATE NAME=hi_filament
    RESPONSE_INFO MSG="HI_LOAD: heating to {temp}C"
    M104 S{temp}
    IF_NEED_HOME
    G90
    G0 X{box.extrude_pos_x} Y{box.extrude_pos_y} F12000
    M109 S{temp}
    M83
    G1 E{length * 0.6} F360
    G1 E{length * 0.4} F180
    G1 E-1 F1800
    M400
    POP_FILAMENT_OUT
    {% if not keep_hot %}
      M104 S0
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    RESTORE_GCODE_STATE NAME=hi_filament
    RESPONSE_INFO MSG="HI_LOAD: done"
  {% endif %}

[gcode_macro HI_UNLOAD]
description: Single colour (no CFS): heat, form tip, retract out of the extruder
gcode:
  {% set temp = params.TEMP|default(220)|int %}
  {% set length = params.LENGTH|default(100)|float %}
  {% set keep_hot = params.KEEP_HOT|default(0)|int %}
  {% set box = printer.configfile.settings['box'] %}
  {% if printer.print_stats.state|lower in ['printing', 'paused'] %}
    RESPONSE_INFO MSG="!! HI_UNLOAD: printer is {printer.print_stats.state} - use M600 for a mid-print change"
  {% elif temp < 170 or temp > 300 %}
    RESPONSE_INFO MSG="!! HI_UNLOAD: TEMP={temp} out of range (170-300)"
  {% else %}
    SAVE_GCODE_STATE NAME=hi_filament
    RESPONSE_INFO MSG="HI_UNLOAD: heating to {temp}C"
    M104 S{temp}
    IF_NEED_HOME
    G90
    G0 X{box.extrude_pos_x} Y{box.extrude_pos_y} F12000
    M109 S{temp}
    M83
    G1 E10 F180
    G1 E-15 F2400
    G4 P3000
    G1 E-{length} F600
    M400
    {% if not keep_hot %}
      M104 S0
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    RESTORE_GCODE_STATE NAME=hi_filament
    RESPONSE_INFO MSG="HI_UNLOAD: done - pull the filament out"
  {% endif %}
