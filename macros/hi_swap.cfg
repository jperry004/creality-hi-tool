# hi_swap.cfg - manual mid-print colour change for the Creality Hi (no CFS), driven by the Resume button.
#
#   Orca: Printer settings > Machine G-code > Change filament G-code, add as the LAST line:
#         HI_SWAP
#
#   What happens:
#     HI_SWAP     pause, retract, lift (to ~50 mm or +2 mm), park over the purge chute, nozzle -> 140C
#     Resume #1    heat back to print temp, unload the old filament (tip + 100 mm pull),
#                  extruder motor off so you can pull the old one and push the new one in by hand
#     Resume #2    purge 80 mm at the chute, nozzle wipe, go back over the part, carry on printing
#
#   Options:  HI_SWAP TEMP=245 STANDBY=150 PURGE=100 UNLOAD=0
#             (TEMP defaults to the current nozzle target; UNLOAD=0 skips the automatic unload)
#
# Install: upload to the config folder and add  [include hi_swap.cfg]  to printer.cfg
#          BELOW [include gcode_macro.cfg] (it overrides the stock RESUME, so it must come after it),
#          ABOVE the SAVE_CONFIG block, then RESTART (host RESTART, not FIRMWARE_RESTART).
# Also works with no print running (test / single-colour swap): G28, then HI_SWAP TEMP=240,
# then send RESUME twice from the console (the screen only shows Resume during a print).
# A normal pause from the screen is not affected - RESUME behaves like stock unless a HI_SWAP is in progress.

[gcode_macro HI_SWAP]
description: Manual colour change - park/cool, Resume = heat+unload, Resume = purge+continue
variable_stage: 0
variable_temp: 0
variable_purge: 80
variable_unload: 1
variable_lift: 0
variable_x: 0
variable_y: 0
variable_z: 0
variable_t0: 0
gcode:
  {% set t = params.TEMP|default(printer.extruder.target)|int %}
  {% if printer.pause_resume.is_paused %}
    RESPONSE_INFO MSG="!! HI_SWAP: already paused"
  {% elif t < 170 or t > 300 %}
    RESPONSE_INFO MSG="!! HI_SWAP: TEMP={t} out of range (170-300) - nozzle not heated? use HI_SWAP TEMP=240"
  {% elif "xyz" not in printer.toolhead.homed_axes %}
    RESPONSE_INFO MSG="!! HI_SWAP: printer not homed - run G28 first"
  {% else %}
    {% set box = printer.configfile.settings['box'] %}
    {% set standby = params.STANDBY|default(140)|int %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < 48.0 %}
      {% set lift = 50.0 - act_z %}
    {% elif act_z < max_z - 2.0 %}
      {% set lift = 2.0 %}
    {% else %}
      {% set lift = max_z - act_z %}
    {% endif %}
    {% set pos = printer.gcode_move.gcode_position %}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=x VALUE={pos.x}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=y VALUE={pos.y}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=z VALUE={pos.z}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=lift VALUE={lift}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=temp VALUE={t}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=purge VALUE={params.PURGE|default(80)|float}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=unload VALUE={params.UNLOAD|default(1)|int}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=t0 VALUE={printer.print_stats.total_duration|float}
    PAUSE_BASE
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=stage VALUE=1
    {% if printer.extruder.can_extrude %}
      M83
      G1 E-3 F1800
    {% endif %}
    G91
    G1 Z{lift} F600
    G90
    G1 X{box.extrude_pos_x} Y{box.extrude_pos_y} F12000
    M104 S{standby}
    M400
    RESPONSE_INFO MSG="HI_SWAP: paused for colour change, nozzle at {standby}C. Press Resume to heat to {t}C and unload."
  {% endif %}

[gcode_macro _HI_SWAP_HEAT]
gcode:
  {% set s = printer["gcode_macro HI_SWAP"] %}
  RESPONSE_INFO MSG="HI_SWAP: heating to {s.temp}C ..."
  M109 S{s.temp}
  {% if s.unload|int == 1 %}
    M83
    G1 E10 F180
    G1 E-15 F2400
    G4 P3000
    G1 E-100 F600
    M400
  {% endif %}
  SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
  SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=stage VALUE=2
  RESPONSE_INFO MSG="HI_SWAP: hot. Pull the old filament, push the new one in until it reaches the nozzle, then press Resume."

[gcode_macro _HI_SWAP_FINISH]
gcode:
  {% set s = printer["gcode_macro HI_SWAP"] %}
  M109 S{s.temp}
  M83
  G1 E{s.purge * 0.6} F360
  G1 E{s.purge * 0.4} F180
  G1 E-0.8 F2400
  G4 P2000
  M400
  BOX_NOZZLE_CLEAN
  G90
  G1 X{s.x} Y{s.y} F12000
  G1 Z{s.z + 0.4} F600
  M400
  SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=stage VALUE=0
  RESPONSE_INFO MSG="HI_SWAP: resuming print"
  RESUME_BASE

# Overrides the stock RESUME gcode (description/rename_existing stay from gcode_macro.cfg).
# Stock behaviour is reproduced exactly when no HI_SWAP is in progress.
[gcode_macro RESUME]
gcode:
  {% set s = printer["gcode_macro HI_SWAP"] %}
  {% set mine = s.stage|int > 0 and printer.pause_resume.is_paused and printer.print_stats.total_duration|float >= s.t0|float %}
  {% if mine and s.stage|int == 1 %}
    _HI_SWAP_HEAT
  {% elif mine and s.stage|int == 2 %}
    _HI_SWAP_FINISH
  {% else %}
    SET_GCODE_VARIABLE MACRO=HI_SWAP VARIABLE=stage VALUE=0
    RESUME_BOX_ERROR_CLEAR
    RESUME_EXTERNAL_PROCESS
    RESUME_BASE
  {% endif %}
