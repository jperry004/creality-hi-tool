[gcode_macro REMOVE_PART_DYNAMIC]
description: Wait for cooling, then ram the part(s) off the plate with the toolhead casing

# ============================================================
# RAM TRAVEL RELATIVE TO PART CENTER
# ============================================================
variable_ram_start_before_center: 100.0
variable_ram_end_after_center: 130.0

# ============================================================
# SPEEDS
# ============================================================
variable_ram_speed: 3000
variable_travel_speed: 6000

# ============================================================
# TOOLHEAD GEOMETRY - measured on the Hi, mm from the nozzle centre
# ============================================================
# front face (the pusher, -Y side) is this far in front of the nozzle
variable_casing_front: 41.0
# back of the casing (carriage / gantry are further back but higher)
variable_casing_back: 30.0
# casing reaches this far left and right of the nozzle
variable_casing_half_w: 30.0
# lowest casing edge is this high above the nozzle tip ...
variable_casing_gap: 3.0
# ... then the bottom slopes back for this much more height; the solid,
# vertical pushing face starts at casing_gap + casing_slope (11 mm) above the tip.
# A part that only reaches the slope gets wedged down instead of pushed.
variable_casing_slope: 8.0
# lowest nozzle height while pushing (solid face then starts at 13 mm)
variable_min_nozzle_z: 2.0
# the solid face must overlap the part by at least this -> min part height 18 mm
variable_min_contact: 5.0
# pass 1 (peel): the solid face's bottom edge hits at this fraction of the part height.
# Pushing high tips the part forward and peels its back edge off the plate - far less
# force than shearing it at the base. Pass 2 (sweep) then runs at min_nozzle_z to clear
# anything that tipped over or is still stuck.
variable_peel_frac: 0.5
# how many times to hit at the peel height (no sensor can tell if it already let go,
# so repeated hits fatigue the bond), then how many low sweeps
variable_peel_hits: 3
variable_sweep_hits: 1

# 1 = the position was SET by hand (hi_tool jog-z unlock / recover-z goto), not measured.
# The macro refuses to ram until recover-z finishes (or Klipper restarts, which resets it).
variable_pos_guess: 0

# ============================================================
# Parameters (all optional except the three from the slicer)
#   CENTER_X / CENTER_Y / TOP_Z   from the slicer end gcode
#   WAIT=600          cool-down seconds before ramming (0 = none)
#   RAM_SPEED=3000    push feedrate, mm/min
#   PART_MIN_X / PART_MAX_X / PART_MAX_Y   first-layer footprint from the slicer
#                     (optional but recommended): sets BACK_Y and LANES automatically
#   LANES=            number of X lanes (1, 3, 5 ...: centre, -SPACING, +SPACING ...);
#                     default: enough to cover PART_MIN_X..PART_MAX_X, else 1
#   SPACING=40        mm between lanes (casing is 60 mm wide - keep it under that)
#   PUSH_TO_EDGE=1    push all the way to the Y minimum (front face ends ~41 mm
#                     past the plate's front edge); 0 = stop
#                     ram_start_before_center short of the centre
#   PEEL_Z=           nozzle Z for pass 1 (overrides peel_frac; a checker app can set it)
#   LOW_Z=            nozzle Z for pass 2 (default min_nozzle_z)
#   PEEL_HITS=3       hits at the peel height
#   SWEEP_HITS=1      low sweeps after that
#   BACK_Y=           nozzle Y where the casing comes down behind the parts.
#                     Default: PART_MAX_Y + casing_front + 3 if given (refuses if that is
#                     past Y max), else CENTER_Y + ram_end_after_center clamped to Y max
#                     (a guess). hi_tool works it out per lane from the real outlines.
#
# Console use after a finished print (END_PRINT has already done M84):
#   SET_KINEMATIC_POSITION     (trust the parked position, NEVER G28 Z)
#   G28 X Y
#   REMOVE_PART_DYNAMIC CENTER_X=.. CENTER_Y=.. TOP_Z=.. WAIT=0
# ============================================================
gcode:
    {% set v = printer["gcode_macro REMOVE_PART_DYNAMIC"] %}

    {% set part_x = params.CENTER_X|float %}
    {% set part_y = params.CENTER_Y|float %}
    {% set part_top_z = params.TOP_Z|float %}
    {% set wait = params.WAIT|default(600)|int %}
    {% set ram_speed = params.RAM_SPEED|default(v.ram_speed)|int %}
    {% set spacing = params.SPACING|default(40)|float %}
    {% set push_to_edge = params.PUSH_TO_EDGE|default(1)|int %}
    {% set travel = v.travel_speed %}
    {% set face_z = v.casing_gap + v.casing_slope %}
    {% set min_top = v.min_nozzle_z + face_z + v.min_contact %}

    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% set y_max = printer.toolhead.axis_maximum.y %}
    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% set x_max = printer.toolhead.axis_maximum.x %}

    # ---- where the casing comes down: front face (casing_front ahead of the nozzle) + 3 mm behind the parts
    {% set back_guess = 0 %}
    {% if 'BACK_Y' in params %}
        {% set back_y = params.BACK_Y|float %}
    {% elif 'PART_MAX_Y' in params %}
        {% set back_y = params.PART_MAX_Y|float + v.casing_front + 3.0 %}
    {% else %}
        {% set back_y = [part_y + v.ram_end_after_center, y_max]|min %}
        {% set back_guess = 1 %}
    {% endif %}

    # ---- lanes: given, or enough to cover the footprint width (each lane covers casing width - 10 mm)
    {% if 'LANES' in params %}
        {% set lanes = params.LANES|int %}
    {% elif 'PART_MIN_X' in params and 'PART_MAX_X' in params %}
        {% set width = params.PART_MAX_X|float - params.PART_MIN_X|float %}
        {% set cover = 2.0 * v.casing_half_w - 10.0 %}
        {% set per_side = ([width - cover, 0.0]|max / (2.0 * spacing))|round(0, 'ceil')|int %}
        {% set lanes = 1 + 2 * per_side %}
    {% else %}
        {% set lanes = 1 %}
    {% endif %}

    {% if v.pos_guess|int == 1 %}

        RESPONSE_INFO MSG="!! REMOVE_PART_DYNAMIC: the toolhead position was set by hand (unlock / guess), not homed - finish Recover Z first. Refusing to move."

    {% elif printer.toolhead.homed_axes|lower != "xyz" %}

        RESPONSE_INFO MSG="!! REMOVE_PART_DYNAMIC: not homed ({printer.toolhead.homed_axes}) - SET_KINEMATIC_POSITION then G28 X Y first. Never G28 Z with parts on the plate."

    {% elif part_top_z < min_top %}

        M117 Part below {min_top|round(1)}mm - no ram
        RESPONSE_INFO MSG="REMOVE_PART_DYNAMIC: part is {part_top_z} mm, needs {min_top|round(1)} mm for the casing's flat face to reach it - not ramming"

    {% elif back_y > y_max %}

        M117 Part too far back - no ram
        RESPONSE_INFO MSG="!! REMOVE_PART_DYNAMIC: the casing would have to come down at Y{back_y|round(1)} to clear the parts, Y max is {y_max} - it would land on them. Not ramming; take them off by hand."

    {% else %}

        {% if back_guess %}
            RESPONSE_INFO MSG="REMOVE_PART_DYNAMIC: no PART_MAX_Y / BACK_Y given - descending at Y{back_y|round(1)} (guess: parts must end before Y{(back_y - v.casing_front - 3.0)|round(1)})"
        {% endif %}

        # ---------------- cool-down ----------------
        {% if wait > 0 %}
            M117 Cooling {wait}s before ram
            G4 P{wait * 1000}
        {% endif %}

        G90

        # ---------------- Y travel ----------------
        {% if push_to_edge %}
            {% set ram_start_y = y_min %}
        {% else %}
            {% set ram_start_y = [part_y - v.ram_start_before_center, y_min]|max %}
        {% endif %}
        {% set ram_end_y = back_y %}

        # ---------------- ram heights (nozzle Z) ----------------
        # The solid face starts face_z (11 mm) above the nozzle tip; below that it slopes back.
        # Pass 1 = peel: face edge at peel_frac of the part height (max leverage, still on the body,
        #          at least min_contact of face on the part).
        # Pass 2 = sweep: nozzle at LOW_Z / min_nozzle_z, pushes off whatever tipped or stayed.
        # Peel runs PEEL_HITS times, sweep SWEEP_HITS times. If peel and sweep would be within
        # 2 mm of each other, every hit runs at the low height.
        {% set z_low = params.LOW_Z|default(v.min_nozzle_z)|float %}
        {% set z_peel_max = part_top_z - v.min_contact - face_z %}
        {% set z_peel = params.PEEL_Z|default(part_top_z * v.peel_frac - face_z)|float %}
        {% set z_peel = [[z_peel, z_peel_max]|min, z_low]|max %}
        {% set peel_hits = [params.PEEL_HITS|default(v.peel_hits)|int, 0]|max %}
        {% set sweep_hits = [params.SWEEP_HITS|default(v.sweep_hits)|int, 1]|max %}
        {% if z_peel - z_low < 2.0 %}
            {% set z_peel = z_low %}
        {% endif %}
        {% set heights = [z_peel|round(2)] * peel_hits + [z_low|round(2)] * sweep_hits %}

        {% set safe_z = part_top_z + 30.0 %}

        # ---------------- lanes: centre first, then alternating out ----------------
        {% set lane_x = [] %}
        {% for i in range(lanes) %}
            {% set step = ((i + 1) // 2) * spacing %}
            {% set off = step if i % 2 == 0 else -step %}
            {% set x = [[part_x + off, x_min]|max, x_max]|min %}
            {% set _ = lane_x.append(x) %}
        {% endfor %}

        RESPONSE_INFO MSG="RAM: Y {ram_end_y|round(1)} -> {ram_start_y|round(1)}, Z {heights|join(' / ')}, lanes X {lane_x|join(' / ')}, F{ram_speed}"

        # never go DOWN to travel: if the head is already higher than safe_z, travel at its current height
        {% set z_max = printer.toolhead.axis_maximum.z %}
        {% set travel_z = [[safe_z, printer.toolhead.position.z]|max, z_max - 1]|min %}
        G1 Z{travel_z} F{travel}

        {% for z in heights %}
            {% set pass_no = loop.index %}
            {% for x in lane_x %}
                M117 Ram pass {pass_no} lane {loop.index}
                G1 X{x} Y{ram_end_y} F{travel}
                G1 Z{z} F600
                G1 Y{ram_start_y} F{ram_speed}
                G1 Z{safe_z} F600
                G28 Y
                G90
            {% endfor %}
        {% endfor %}

        M117 Ram done
        # No M84 here: END_PRINT runs next and needs the axes homed for its Z move.

    {% endif %}
